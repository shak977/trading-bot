name: Nightly Analyst

# The autonomous self-improving loop: after the close each weekday, review the bot's own resolved
# trades across every strategy bucket and write a dated report with prioritised proposed changes.
# Runs in the cloud — no Mac required. Advisory only: it proposes, the owner approves.
on:
  schedule:
    - cron: "30 22 * * 1-5"   # ~22:30 UTC weekdays — after the settled-close build
  workflow_dispatch:

concurrency:
  group: analyst
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run the analyst
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python analyst.py | tee analyst_out.txt
      - name: Run the alpha benchmark (long book vs SPY)
        continue-on-error: true
        env:
          LIVE_QUOTES_URL: ${{ secrets.LIVE_QUOTES_URL }}
        run: python benchmark.py | tee -a analyst_out.txt
      - name: Validate the timing engine (walk-forward on index history)
        continue-on-error: true
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"
        run: python timing_backtest.py | tee -a analyst_out.txt
      - name: Validate the entry setups (walk-forward hit rate + edge)
        continue-on-error: true
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"
        run: python setups_backtest.py | tee -a analyst_out.txt
      - name: Backtest + stress-test every strategy under the live exit model
        continue-on-error: true
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"
        run: python strategy_backtest.py --json | tee -a analyst_out.txt

      - name: Run the system diagnostic (direction / R:R / de-confounded checks)
        continue-on-error: true
        run: python system_diagnostic.py --json | tee -a analyst_out.txt
      - name: Retrain meta-label model (walk-forward AUC vs conviction baseline)
        continue-on-error: true
        run: python meta_label.py --json | tee -a analyst_out.txt
      - name: Guardrails sweep (logic-integrity police)
        continue-on-error: true
        run: |
          python guardrails.py --json | tee -a analyst_out.txt
          grep -q "CRITICAL\]" analyst_out.txt && echo "::warning::Guardrails found CRITICAL logic issues — see job summary" || true

      - name: Remediation pipeline (triage -> validate -> tiered fix -> log)
        continue-on-error: true
        run: python remediate.py --json | tee -a analyst_out.txt

      - name: Publish to the job summary
        run: |
          echo "### Nightly analyst" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat analyst_out.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the report
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analyst_report.json analyst_history.json analyst_memory.json benchmark.json benchmark_history.json timing_study.json setups_study.json system_diagnostic.json meta_model.json meta_history.json strategy_study.json guardrails_report.json remediation_log.json remediation_queue.json
          git diff --staged --quiet && exit 0
          git commit -m "nightly analyst report [skip ci]"
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main || true
