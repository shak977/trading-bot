name: Weekly Trading Signals

# Scans every weekday. Pre-market runs (~6–8:30am ET) refresh news + news-driven ideas + alerts
# before the open; then every 30 min through the US market window (covers EDT & EST) so
# signals/news stay fresh intraday, plus a final run ~2h after the close when the daily bar is
# settled. Also manual + on push. NB: technical signals use completed DAILY bars, so they don't
# change pre-market — the pre-market value is the news/idea layer, not new BUY/SHORT calls.
# Note: GitHub may delay/skip scheduled runs under load — ~10 min is about the practical floor.
on:
  schedule:
    - cron: "*/30 10-12 * * 1-5"  # PRE-MARKET: every 30 min ~6–8:30am ET (refreshes news + news-driven ideas + alerts before the open)
    - cron: "*/10 13-21 * * 1-5"  # MARKET HOURS: every 10 min, ~9:30am–5pm ET (handles EDT & EST) — fresher news/alerts/prices
    - cron: "0 22 * * 1-5"        # ~final, after close — settled daily bar
  workflow_dispatch:
  push:
    branches: [main]   # redeploy the live site whenever code is updated

# At 10-min cadence a slow build could overlap the next — supersede the in-flight run so the
# freshest data wins and runs never pile up. (Deploy happens before the track-record commit.)
concurrency:
  group: signals-build
  cancel-in-progress: true

permissions:
  contents: write   # allow committing the updated track_record.json back to the repo
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Is today a US trading day?
        id: gate
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"
        run: echo "trading=$(python gate.py)" >> "$GITHUB_OUTPUT"

      - name: Generate dashboard
        if: ${{ github.event_name != 'schedule' || steps.gate.outputs.trading == 'true' }}
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LIVE_QUOTES_URL: ${{ secrets.LIVE_QUOTES_URL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          PAPER_TRADE: ${{ vars.PAPER_TRADE }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_NTFY_TOPIC: ${{ vars.ALERT_NTFY_TOPIC }}
          ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SITE_URL: ${{ vars.SITE_URL }}
          PAPER_RESET_DATE: ${{ vars.PAPER_RESET_DATE }}
          WIDE_UNIVERSE: ${{ vars.WIDE_UNIVERSE }}
          ORB_ENABLED: ${{ vars.ORB_ENABLED }}
        run: |
          python dashboard.py
          mkdir -p _site
          cp dashboard.html _site/index.html
          cp chart_engine.js _site/chart_engine.js
          cp signals.json _site/signals.json
          cp track_record.json _site/track_record.json 2>/dev/null || true
          cp manifest.webmanifest _site/manifest.webmanifest
          cp icon-180.png icon-192.png icon-512.png icon-512-maskable.png _site/ 2>/dev/null || true

      - name: Data-integrity audit
        if: ${{ github.event_name != 'schedule' || steps.gate.outputs.trading == 'true' }}
        continue-on-error: true
        run: |
          python audit.py signals.json | tee audit_out.txt
          echo "### Data audit" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat audit_out.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -q "flagged" audit_out.txt && echo "::warning::Data audit flagged anomalies — see job summary" || true

      # --- Deploy FIRST so a track-record push race can never block the site ---
      - uses: actions/upload-pages-artifact@v3
        if: ${{ github.event_name != 'schedule' || steps.gate.outputs.trading == 'true' }}
        with:
          path: _site

      - id: deployment
        if: ${{ github.event_name != 'schedule' || steps.gate.outputs.trading == 'true' }}
        uses: actions/deploy-pages@v4

      # --- Persist the track-record log last; never fail the job if it can't push ---
      - name: Commit updated track record
        if: ${{ github.event_name != 'schedule' || steps.gate.outputs.trading == 'true' }}
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add track_record.json track_record_intraday.json track_record_orb.json orb_backtest.json momentum_history.json paper_orders.json alerts_sent.json signals_seen.json news_candidates.json prev_state.json risk_state.json
          git diff --staged --quiet && exit 0
          git commit -m "update track record + momentum history [skip ci]"
          # rebase on any concurrent change, then push (best effort)
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main || true
