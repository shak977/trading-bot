name: Weekly Trading Signals

# Runs every weekday at 22:00 UTC — ~2 hours after the US market close (4pm ET),
# so each day's daily price bar is final. Also manual + on push.
on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]   # redeploy the live site whenever code is updated

permissions:
  contents: write   # allow committing the updated track_record.json back to the repo
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Is today a US trading day?
        id: gate
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"
        run: echo "trading=$(python gate.py)" >> "$GITHUB_OUTPUT"

      - name: Generate dashboard
        if: ${{ github.event_name != 'schedule' || steps.gate.outputs.trading == 'true' }}
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LIVE_QUOTES_URL: ${{ secrets.LIVE_QUOTES_URL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python dashboard.py
          mkdir -p _site
          cp dashboard.html _site/index.html
          cp signals.json _site/signals.json
          cp track_record.json _site/track_record.json 2>/dev/null || true

      - name: Data-integrity audit
        if: ${{ github.event_name != 'schedule' || steps.gate.outputs.trading == 'true' }}
        continue-on-error: true
        run: |
          python audit.py signals.json | tee audit_out.txt
          echo "### Data audit" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat audit_out.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -q "flagged" audit_out.txt && echo "::warning::Data audit flagged anomalies — see job summary" || true

      # --- Deploy FIRST so a track-record push race can never block the site ---
      - uses: actions/upload-pages-artifact@v3
        if: ${{ github.event_name != 'schedule' || steps.gate.outputs.trading == 'true' }}
        with:
          path: _site

      - id: deployment
        if: ${{ github.event_name != 'schedule' || steps.gate.outputs.trading == 'true' }}
        uses: actions/deploy-pages@v4

      # --- Persist the track-record log last; never fail the job if it can't push ---
      - name: Commit updated track record
        if: ${{ github.event_name != 'schedule' || steps.gate.outputs.trading == 'true' }}
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add track_record.json
          git diff --staged --quiet && exit 0
          git commit -m "update track record [skip ci]"
          # rebase on any concurrent change, then push (best effort)
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main || true
