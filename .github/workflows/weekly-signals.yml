name: Weekly Trading Signals

# Runs every Monday 13:45 UTC (~just before US open is 13:30 UTC; adjust as needed),
# and can be triggered manually from the Actions tab.
on:
  schedule:
    - cron: "45 13 * * 1"
  workflow_dispatch:
  push:
    branches: [main]   # redeploy the live site whenever code is updated

permissions:
  contents: write   # allow committing the updated track_record.json back to the repo
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Generate dashboard
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python dashboard.py
          mkdir -p _site
          cp dashboard.html _site/index.html
          cp signals.json _site/signals.json
          cp track_record.json _site/track_record.json 2>/dev/null || true

      - name: Commit updated track record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add track_record.json
          git diff --staged --quiet || git commit -m "update track record [skip ci]"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
